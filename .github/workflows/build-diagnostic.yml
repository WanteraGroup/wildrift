name: Temporary Build Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - name: Capture build error
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "BUILD FAILED (exit $code)"
            cat build.log
            title="TEMP BUILD ERROR ${GITHUB_SHA:0:7}"
            body="$(cat build.log)"
            gh issue create --title "$title" --body "$body"
            exit "$code"
          fi
