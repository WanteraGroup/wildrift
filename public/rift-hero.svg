<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02060c"/><stop offset=".45" stop-color="#071b2c"/><stop offset="1" stop-color="#03070e"/></linearGradient>
  <radialGradient id="sky" cx=".72" cy=".18" r=".6"><stop stop-color="#37d9ff" stop-opacity=".30"/><stop offset=".45" stop-color="#1c66b4" stop-opacity=".09"/><stop offset="1" stop-opacity="0"/></radialGradient>
  <radialGradient id="core"><stop stop-color="#b8fbff" stop-opacity=".95"/><stop offset=".18" stop-color="#50e5ff" stop-opacity=".85"/><stop offset=".55" stop-color="#0d93d0" stop-opacity=".18"/><stop offset="1" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a2"/><stop offset=".5" stop-color="#e9bd5c"/><stop offset="1" stop-color="#835919"/></linearGradient>
