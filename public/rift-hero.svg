  <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".55"/></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4adfff" stroke-opacity=".055"/></pattern>
</defs>
